services:
  opensandbox-server:
    image: ${OPENLINK_OPENSANDBOX_SERVER_IMAGE:?required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENLINK_OPENSANDBOX_BIND_PORT:-43122}:43122"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
      OPENSANDBOX_SERVER_API_KEY: ${OPENSANDBOX_SERVER_API_KEY:?required}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/opensandbox.toml:/etc/opensandbox/config.toml:ro
      - ${OPENLINK_REMOTE_ROOT:?required}/state:/state
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:43122/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
