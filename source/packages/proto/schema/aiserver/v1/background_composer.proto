  rpc ForkBackgroundComposer(.aiserver.v1.ForkBackgroundComposerRequest) returns (.aiserver.v1.ForkBackgroundComposerResponse);
  rpc StartSideChatBackgroundComposer(.aiserver.v1.StartSideChatBackgroundComposerRequest) returns (.aiserver.v1.StartSideChatBackgroundComposerResponse);
  rpc ListBackgroundComposerChildren(.aiserver.v1.ListBackgroundComposerChildrenRequest) returns (.aiserver.v1.ListBackgroundComposerChildrenResponse);
  rpc MakePRBackgroundComposer(.aiserver.v1.MakePRBackgroundComposerRequest) returns (.aiserver.v1.MakePRBackgroundComposerResponse);
  rpc OpenPRBackgroundComposer(.aiserver.v1.OpenPRBackgroundComposerRequest) returns (.aiserver.v1.OpenPRBackgroundComposerResponse);
