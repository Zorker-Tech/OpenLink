message SubagentCredentials {
  oneof credentials {
    .agent.v1.ApiKeyCredentials api_key_credentials = 1 [json_name = "apiKeyCredentials"];
    .agent.v1.AzureCredentials azure_credentials = 2 [json_name = "azureCredentials"];
    .agent.v1.BedrockCredentials bedrock_credentials = 3 [json_name = "bedrockCredentials"];
  }
}

enum SubagentExecutionEnvironment {
  SUBAGENT_EXECUTION_ENVIRONMENT_UNSPECIFIED = 0;
  SUBAGENT_EXECUTION_ENVIRONMENT_LOCAL = 1;
  SUBAGENT_EXECUTION_ENVIRONMENT_CLOUD = 2;
}

message SubagentModelOverride {
  string subagent_type = 1 [json_name = "subagentType"];
  oneof selection {
    .agent.v1.RequestedModel model = 2 [json_name = "model"];
    bool inherit = 3 [json_name = "inherit"];
    bool disabled = 4 [json_name = "disabled"];
  }
}

enum SubagentRunStatus {
  SUBAGENT_RUN_STATUS_UNSPECIFIED = 0;
  SUBAGENT_RUN_STATUS_RUNNING = 1;
  SUBAGENT_RUN_STATUS_BACKGROUNDED = 2;
  SUBAGENT_RUN_STATUS_SUCCESS = 3;
  SUBAGENT_RUN_STATUS_ERROR = 4;
  SUBAGENT_RUN_STATUS_ABORTED = 5;
}

enum SubscriptionSource {
  SUBSCRIPTION_SOURCE_UNSPECIFIED = 0;
  SUBSCRIPTION_SOURCE_SLACK = 1;
  SUBSCRIPTION_SOURCE_GITHUB = 2;
  SUBSCRIPTION_SOURCE_LINEAR = 3;
  SUBSCRIPTION_SOURCE_ORIGIN = 4;
}

message TaskToolCallArgsProto {
  string description = 1 [json_name = "description"];
  string prompt = 2 [json_name = "prompt"];
  string model = 3 [json_name = "model"];
  string subagent_type = 4 [json_name = "subagentType"];
  string resume = 5 [json_name = "resume"];
  bool readonly = 6 [json_name = "readonly"];
  bool run_in_background = 7 [json_name = "runInBackground"];
  repeated string attachments = 8 [json_name = "attachments"];
  .agent.v1.SubagentExecutionEnvironment environment = 9 [json_name = "environment"];
  string cloud_base_branch = 10 [json_name = "cloudBaseBranch"];
  string cloud_requested_environment_build_id = 11 [json_name = "cloudRequestedEnvironmentBuildId"];
  .agent.v1.TargetMachine machine = 12 [json_name = "machine"];
}

message ThinkingDetails {
}

enum ThinkingStyle {
  THINKING_STYLE_UNSPECIFIED = 0;
  THINKING_STYLE_DEFAULT = 1;
  THINKING_STYLE_CODEX = 2;
  THINKING_STYLE_GPT5 = 3;
}
